{% extends 'layouts/base.html' %}
{% load static %}

{% block content %}
<div style="background-color: #E3D5CA; padding: 40px 20px; direction: rtl;">

    <h1 style="color: #4B3832; font-size: 60px; font-family: 'Aref Ruqaa', serif; margin-bottom: 40px;">مـرحباً بـك في مـتجـر كــولايـز</h1>

    <div style="display: flex; gap: 20px; justify-content: center; align-items: flex-start; flex-wrap: wrap;">

        <div style="flex: 2; min-width: 400px;">
            <div style="border: 10px solid #F5EBE0; border-radius: 15px; overflow: hidden; box-shadow: 0 10px 20px rgba(0,0,0,0.1);">
                <img src="{% static 'images/1.png' %}" style="width: 100%; height: 1000px; object-fit: cover;">
            </div>
        </div>

        <div style="flex: 1; min-width: 250px; display: flex; flex-direction: column; gap: 20px;">
            <div style="border: 10px solid #F5EBE0; border-radius: 15px; overflow: hidden; box-shadow: 0 10px 20px rgba(0,0,0,0.1);">
                <img src="{% static 'images/10.png' %}" style="width: 100%; height: 300px; object-fit: cover;">
            </div>
            <div style="border: 10px solid #F5EBE0; border-radius: 15px; overflow: hidden; box-shadow: 0 10px 20px rgba(0,0,0,0.1);">
                <img src="{% static 'images/12.jpg' %}" style="width: 100%; height: 900px; object-fit: cover;">
            </div>
        </div>

        <div style="flex: 1.5; min-width: 300px;">
            <div style="border: 10px solid #F5EBE0; border-radius: 15px; overflow: hidden; box-shadow: 0 10px 20px rgba(0,0,0,0.1);">
                <img src="{% static 'images/4.jpg' %}" style="width: 100%; height: 1000px; object-fit: cover;">
            </div>
        </div>

        <div style="flex: 1; min-width: 250px; display: flex; flex-direction: column; gap: 20px;">
            <div style="border: 10px solid #F5EBE0; border-radius: 15px; overflow: hidden; box-shadow: 0 10px 20px rgba(0,0,0,0.1);">
                <img src="{% static 'images/9.png' %}" style="width: 100%; height: 200px; object-fit: cover;">
            </div>
            <div style="border: 10px solid #F5EBE0; border-radius: 15px; overflow: hidden; box-shadow: 0 10px 20px rgba(0,0,0,0.1);">
                <img src="{% static 'images/5.png' %}" style="width: 100%; height: 700px; object-fit: cover;">
            </div>
        </div>


    </div>

    <div style="margin-top: 50px;">
        <a href="{% url 'home:list' %}" style="background: #4B3832; color: #F5EBE0; padding: 15px 50px; text-decoration: none; border-radius: 10px; font-size: 24px; font-weight: bold;">
            استكشف قائمتنا الكاملة
        </a>
    </div>

</div>
{% endblock %}
